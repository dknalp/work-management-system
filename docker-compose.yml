services:
  backend:
    build: ./backend
    # SIGINT triggers uvicorn's clean shutdown path more reliably than SIGTERM.
    # 10 s gives in-flight requests time to finish before Docker force-kills.
    stop_signal: SIGINT
    stop_grace_period: 10s
    # Mount the Firebase service account key at runtime so it is never baked
    # into the image layers.  The host path is read from FIREBASE_SERVICE_ACCOUNT_JSON
    # in the root .env file; it is mounted read-only at /run/secrets/firebase.json.
    volumes:
      - type: bind
        source: ${FIREBASE_SERVICE_ACCOUNT_JSON}
        target: /run/secrets/firebase.json
        read_only: true
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3051}
      APP_ENV: ${APP_ENV:-production}
      # Firebase — mounted at runtime via the volume above
      FIREBASE_SERVICE_ACCOUNT_JSON: /run/secrets/firebase.json
      # HMAC secret for API key hashing
      HMAC_SECRET: ${HMAC_SECRET:-}
      # Cloudflare R2 — set these in a .env file at the project root
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    ports:
      - "3052:3052"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3052}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ${NEXT_PUBLIC_GOOGLE_PICKER_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_MOCK_AUTH: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    ports:
      - "3051:3051"