services:
  backend:
    build: ./backend
    stop_signal: SIGINT
    stop_grace_period: 10s
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3051}
      APP_ENV: ${APP_ENV:-production}
      # Firebase — pass raw JSON content as env var (no file mount needed)
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      HMAC_SECRET: ${HMAC_SECRET:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Local file storage inside the container, backed by a named volume
      FILE_STORAGE_PATH: /data/files
    volumes:
      - file_storage:/data/files
    ports:
      - "3052:3052"

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
        # The browser never talks to the backend directly — all API calls go
        # through Next.js rewrites (/api/* and legacy prefixes → backend:3052).
        # So NEXT_PUBLIC_API_URL is intentionally left empty here; the
        # api client defaults to "" which means relative URLs that Next.js proxies.
        NEXT_PUBLIC_API_URL: ""
        # Uploads use relative URLs (/api/v1/files/upload) which Next.js
        # proxies to backend:3052. No direct backend URL is ever baked into
        # the JS bundle — this ensures uploads work from any network/domain.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ${NEXT_PUBLIC_GOOGLE_PICKER_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_MOCK_AUTH: "false"
      # Internal URL used by Next.js rewrites to reach the backend container
      BACKEND_INTERNAL_URL: http://backend:3052
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    ports:
      - "3051:3051"

volumes:
  file_storage:
